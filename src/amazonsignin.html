<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signin.css">
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQyTypGL4gAC7txvhXYEqkxDx3ScVbfV16Gcg&usqp=CAU">
    <title>Amazon Sign In</title>
    <style>
        .error {
            color: red;
            font-size: 0.9em;
            margin-top: 4px;
        }
        input.invalid {
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><img src="images/amazonblack.jpg"></div>
        <div class="form">
            <form id="signinForm">
                <p class="big">Sign in</p>
                <p class="bold">Email or mobile phone number</p>
                <input type="text" id="email" placeholder="">
                <small id="emailError" class="error"></small>
                <button type="submit">Continue</button>
                <p class="agree">By continuing, you agree to Amazon's Conditions of</p>
                <p class="agree">Use and Privacy Notice.</p>
                <a href="#">Need help?</a>
                <hr>
                <p><b>Buying for work?</b></p>
                <a href="#">Shop on Amazon Business</a>
            </form>
            <div class="out">
                <p>New to Amazon?</p>
                <button>Create your Amazon account</button>
            </div>
        </div>
        <hr class="hr">
        <div class="last">
            <a href="#"> Conditions of Use </a>
            <a href="#">Privacy Notice </a>
            <a href="#">Help </a>
        </div>
        <div class="last2">© 1996-2024, Amazon.com, Inc. or its affiliates</div>
    </div>

    <script>
        document.getElementById("signinForm").addEventListener("submit", function(e) {
            e.preventDefault(); 

            let email = document.getElementById("email");
            let emailError = document.getElementById("emailError");
            let isValid = true;

    
            emailError.textContent = "";
            email.classList.remove("invalid");

      
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let phonePattern = /^[0-9]{10}$/;

            // Validation
            if (!email.value.trim()) {
                emailError.textContent = "This field is required.";
                email.classList.add("invalid");
                isValid = false;
            } else if (!emailPattern.test(email.value) && !phonePattern.test(email.value)) {
                emailError.textContent = "Enter a valid email or 10-digit phone number.";
                email.classList.add("invalid");
                isValid = false;
            }

      
            if (isValid) {
                alert("Sign in successful!");
            
            }
        });
    </script>
</body>
</html>
